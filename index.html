<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peerly — Direct Machine Link</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1418">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Peerly">
<style>
  :root[data-theme="dark"]{
    --bg:#0f1418; --panel:#161d23; --panel-2:#1c252c; --line:#2a343c;
    --text:#e7edf1; --sub:#8fa1ac; --accent:#4fd1c5; --accent-2:#f2a154;
    --danger:#e06c6c; --ok:#5fd18a; --shadow:0 8px 24px rgba(0,0,0,.35);
    --focus:#4fd1c5;
  }
  :root[data-theme="light"]{
    --bg:#f3f5f6; --panel:#ffffff; --panel-2:#eef1f2; --line:#dbe1e4;
    --text:#12181c; --sub:#5b6b73; --accent:#0f8f82; --accent-2:#c1650f;
    --danger:#c0392b; --ok:#1f8a4c; --shadow:0 6px 18px rgba(20,30,35,.08);
    --focus:#0f8f82;
  }
  :root[data-theme="oled"]{
    --bg:#000000; --panel:#050505; --panel-2:#0b0b0b; --line:#232323;
    --text:#f2f2f2; --sub:#8a8a8a; --accent:#33e2c9; --accent-2:#ffb15c;
    --danger:#ff6b6b; --ok:#59e08a; --shadow:none; --focus:#33e2c9;
  }
  :root[data-theme="hc"]{
    --bg:#000000; --panel:#000000; --panel-2:#000000; --line:#ffffff;
    --text:#ffffff; --sub:#ffffff; --accent:#ffff00; --accent-2:#00ffff;
    --danger:#ff3b3b; --ok:#00ff6a; --shadow:none; --focus:#ffff00;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
    transition:background .2s ease,color .2s ease;
  }
  .mono{font-family:"SF Mono",Consolas,"Roboto Mono",monospace;}
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px; border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent);}
  .brand h1{font-size:16px; margin:0; letter-spacing:.04em; font-weight:700;}
  .brand h1 small{display:block; font-size:10px; color:var(--sub); font-weight:500; letter-spacing:.12em;}
  #themeBtn{
    border:1px solid var(--line); background:var(--panel-2); color:var(--text);
    padding:8px 12px; border-radius:10px; font-size:12px; cursor:pointer;
    display:flex; align-items:center; gap:6px; font-weight:600;
  }
  #themeBtn:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--focus); outline-offset:2px;
  }
  main{flex:1; width:100%; max-width:560px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:14px;}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:16px; box-shadow:var(--shadow);
  }
  .label{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--sub); margin-bottom:8px; display:block;}
  .idrow{display:flex; gap:8px; align-items:center;}
  .idbox{
    flex:1; background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    padding:12px; font-size:28px; font-weight:700; letter-spacing:.25em; text-align:center;
    word-break:break-all;
  }
  .iconbtn{
    border:1px solid var(--line); background:var(--panel-2); color:var(--text);
    border-radius:10px; padding:12px 14px; cursor:pointer; font-size:13px; font-weight:600;
    white-space:nowrap;
  }
  .linkviz{display:flex; align-items:center; justify-content:center; gap:0; margin:14px 0 6px;}
  .node{width:16px;height:16px;border-radius:50%; background:var(--panel-2); border:2px solid var(--line); transition:.25s;}
  .wire{flex:1; max-width:120px; height:2px; background:var(--line); margin:0 6px; position:relative; overflow:hidden;}
  .wire::after{content:""; position:absolute; inset:0; background:var(--accent); transform:scaleX(0); transform-origin:left; transition:transform .5s ease;}
  .linkviz.connected .node{background:var(--ok); border-color:var(--ok);}
  .linkviz.connected .wire::after{transform:scaleX(1);}
  .status{text-align:center; font-size:12px; color:var(--sub); margin-top:2px;}
  .status.live{color:var(--ok); font-weight:700;}
  .ping{font-weight:500; color:var(--sub); margin-left:4px;}
  .qrwrap{display:flex; justify-content:center; margin-top:12px;}
  .qrbox{background:#fff; padding:10px; border-radius:12px; display:none; line-height:0;}
  .qrbox.show{display:block;}
  .qrtoggle{background:none; border:none; color:var(--accent); font-size:12px; font-weight:700; cursor:pointer; padding:4px; margin:6px auto 0; display:block;}
  .progwrap{width:160px; height:6px; background:rgba(128,128,128,.3); border-radius:4px; overflow:hidden; margin-top:6px;}
  .progbar{height:100%; width:0%; background:currentColor; transition:width .15s ease;}
  #chatCard.dragover{outline:2px dashed var(--accent); outline-offset:-6px;}
  .row{display:flex; gap:8px;}
  input[type=text]{
    flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:12px; border-radius:10px; font-size:14px; min-width:0;
  }
  .primary{
    background:var(--accent); color:var(--bg); border:none; border-radius:10px;
    padding:12px 16px; font-weight:700; cursor:pointer; font-size:14px;
  }
  .primary:disabled{opacity:.4; cursor:not-allowed;}
  #chatCard{display:none; flex-direction:column;}
  #log{
    height:44vh; min-height:200px; overflow-y:auto; display:flex; flex-direction:column; gap:8px;
    padding:4px 2px 8px;
  }
  .msg{max-width:80%; padding:9px 12px; border-radius:12px; font-size:14px; line-height:1.35; word-break:break-word;}
  .msg.me{align-self:flex-end; background:var(--accent); color:var(--bg); border-bottom-right-radius:4px;}
  .msg.them{align-self:flex-start; background:var(--panel-2); border:1px solid var(--line); border-bottom-left-radius:4px;}
  .msg.sys{align-self:center; color:var(--sub); font-size:11px; background:none;}
  .msg a{color:inherit; font-weight:700; text-decoration:underline;}
  .composer{display:flex; gap:8px; margin-top:10px;}
  .filebtn{
    border:1px solid var(--line); background:var(--panel-2); color:var(--text);
    border-radius:10px; width:44px; height:44px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:18px; flex-shrink:0;
  }
  footer{
    border-top:1px solid var(--line); padding:18px 12px 22px; margin-top:auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    gap:4px;
  }
  footer p{margin:0; font-size:12px; color:var(--sub);}
  footer strong{color:var(--text);}
  @media (max-width:380px){
    .idbox{font-size:13px;}
    .brand h1{font-size:14px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot" id="brandDot"></span>
    <h1>PEERLY<small>DIRECT MACHINE-TO-MACHINE LINK</small></h1>
  </div>
  <button id="themeBtn" type="button" aria-label="Toggle theme">🌙 Dark</button>
</header>

<main>
  <section class="card" id="idCard">
    <span class="label">Your connection ID</span>
    <div class="idrow">
      <div class="idbox mono" id="myId">generating…</div>
      <button class="iconbtn" id="copyBtn" type="button">Copy</button>
    </div>
    <button class="qrtoggle" id="qrToggle" type="button">Show QR code</button>
    <div class="qrwrap"><div class="qrbox" id="qrBox"><div id="qrCanvas"></div></div></div>

    <div class="linkviz" id="linkViz">
      <span class="node"></span><span class="wire"></span><span class="node"></span>
    </div>
    <p class="status" id="statusText">Waiting for a connection…</p>

    <div class="row" style="margin-top:10px;">
      <input type="text" id="peerInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="4-digit code">
      <button class="primary" id="connectBtn" type="button">Link</button>
    </div>
  </section>

  <section class="card" id="chatCard">
    <span class="label">Session</span>
    <div id="log"></div>
    <div class="composer">
      <button class="filebtn" id="fileTrigger" type="button" aria-label="Send a file">📎</button>
      <input type="file" id="fileInput" hidden multiple>
      <input type="text" id="msgInput" placeholder="Type a message" autocomplete="off">
      <button class="primary" id="sendBtn" type="button">Send</button>
    </div>
  </section>
</main>

<footer>
  <p><strong>© Manik Roy <span id="year"></span>.</strong> All Rights Reserved.</p>
</footer>

<script>
  window.addEventListener('error', e => {
    console.error('Unhandled error:', e.message, e.filename, e.lineno);
  });
  window.addEventListener('unhandledrejection', e => {
    console.error('Unhandled promise rejection:', e.reason);
  });
</script>
<script>
  // ---------- Footer year (runs immediately, no dependencies) ----------
  document.getElementById('year').textContent = new Date().getFullYear();

  // ---------- Theme cycle: dark -> light -> oled -> hc -> dark ----------
  const THEMES = [
    {key:'dark', label:'🌙 Dark'},
    {key:'light', label:'☀️ Light'},
    {key:'oled', label:'⚫ OLED'},
    {key:'hc', label:'◐ HC'}
  ];
  let themeIdx = 0;
  const savedTheme = localStorage.getItem('peerly-theme');
  const savedIdx = THEMES.findIndex(t => t.key === savedTheme);
  if (savedIdx > -1) themeIdx = savedIdx;
  const themeBtn = document.getElementById('themeBtn');
  function applyTheme(){
    const t = THEMES[themeIdx];
    document.documentElement.setAttribute('data-theme', t.key);
    themeBtn.textContent = t.label;
    localStorage.setItem('peerly-theme', t.key);
  }
  themeBtn.addEventListener('click', () => {
    themeIdx = (themeIdx + 1) % THEMES.length;
    applyTheme();
  });
  applyTheme();
</script>
<script>
(function(){
  function loadScript(src){
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.crossOrigin = 'anonymous';
      s.onload = resolve;
      s.onerror = () => reject(new Error('Failed to load ' + src));
      document.head.appendChild(s);
    });
  }

  async function loadWithFallback(urls){
    for (const url of urls) {
      try { await loadScript(url); return true; } catch (e) { /* try next */ }
    }
    return false;
  }

  async function boot(){
    const peerOk = typeof Peer !== 'undefined' || await loadWithFallback([
      'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js'
    ]);
    await loadWithFallback([
      'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'
    ]); // QR code is a nice-to-have; app still works without it

    try {
      initApp(peerOk);
    } catch (err) {
      console.error(err);
      const st = document.getElementById('statusText');
      if (st) st.textContent = 'Something went wrong starting the app. See console for details.';
    }
  }
  boot();
})();
</script>
<script>
  function initApp(peerOk){
  // ---------- PeerJS setup (uses PeerJS's free public cloud broker — no key, no signup) ----------
  const myIdEl = document.getElementById('myId');
  const statusText = document.getElementById('statusText');
  const linkViz = document.getElementById('linkViz');
  const chatCard = document.getElementById('chatCard');
  const log = document.getElementById('log');
  const peerInput = document.getElementById('peerInput');
  const connectBtn = document.getElementById('connectBtn');

  let conn = null;

  if (!peerOk || typeof Peer === 'undefined') {
    myIdEl.textContent = 'unavailable';
    statusText.textContent = 'Could not load the connection library. Check your network and reload.';
    connectBtn.disabled = true;
    return;
  }

  let peer;
  let peerDestroyed = false;
  let idAttempts = 0;
  const MAX_ID_ATTEMPTS = 8;

  function makeShortId(){
    // 4-digit numeric code, e.g. "0042" or "7391"
    return Math.floor(Math.random() * 10000).toString().padStart(4, '0');
  }

  function createPeer(){
    peerDestroyed = false;
    peer = new Peer(makeShortId());
    wirePeerEvents();
  }

  function wirePeerEvents(){
    peer.on('open', id => {
      idAttempts = 0;
      myIdEl.textContent = id;
      if (typeof QRCode !== 'undefined') {
        const holder = document.getElementById('qrCanvas');
        holder.innerHTML = '';
        new QRCode(holder, {text: id, width: 150, height: 150, colorDark: '#000000', colorLight: '#ffffff'});
      }
    });

    peer.on('error', err => {
      if (err.type === 'unavailable-id') {
        idAttempts++;
        if (idAttempts < MAX_ID_ATTEMPTS) {
          statusText.textContent = 'That code is taken, picking another…';
          try { peer.destroy(); } catch (e) {}
          createPeer();
          return;
        }
        statusText.textContent = 'Could not find a free code. Reload to try again.';
        return;
      }
      statusText.textContent = 'Error: ' + (err.type || err.message || 'connection issue');
    });

    peer.on('close', () => { peerDestroyed = true; });

    peer.on('connection', c => setupConnection(c));

    peer.on('disconnected', () => {
      if (peerDestroyed) {
        statusText.textContent = 'Server link permanently lost. Reload the page for a new ID.';
        return;
      }
      statusText.textContent = 'Reconnecting to server…';
      setTimeout(() => {
        if (peerDestroyed) {
          statusText.textContent = 'Server link permanently lost. Reload the page for a new ID.';
          return;
        }
        try { peer.reconnect(); }
        catch (e) { console.error(e); statusText.textContent = 'Reload the page for a new ID.'; }
      }, 1000);
    });
  }

  createPeer();

  document.getElementById('qrToggle').addEventListener('click', function(){
    const box = document.getElementById('qrBox');
    box.classList.toggle('show');
    this.textContent = box.classList.contains('show') ? 'Hide QR code' : 'Show QR code';
  });

  let remoteId = null;
  let reconnectAttempts = 0;
  let manualClose = false;
  let pingTimer = null;
  const MAX_RECONNECTS = 5;

  function attemptReconnect(){
    if (manualClose || !remoteId || peerDestroyed || reconnectAttempts >= MAX_RECONNECTS) {
      if (reconnectAttempts >= MAX_RECONNECTS) addSys('Could not restore the link. Reconnect manually.');
      if (peerDestroyed) addSys('Session link is gone. Reload the page to start over.');
      return;
    }
    reconnectAttempts++;
    statusText.textContent = 'Reconnecting… (attempt ' + reconnectAttempts + '/' + MAX_RECONNECTS + ')';
    setTimeout(() => {
      if (conn && conn.open) return; // already back
      if (peerDestroyed) { addSys('Session link is gone. Reload the page to start over.'); return; }
      try { setupConnection(peer.connect(remoteId, {reliable:true})); }
      catch (e) { console.error(e); addSys('Reconnect failed. Reload the page to start over.'); }
    }, 1000 * reconnectAttempts);
  }

  document.getElementById('copyBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(myIdEl.textContent).then(() => {
      const b = document.getElementById('copyBtn');
      const old = b.textContent; b.textContent = 'Copied!';
      setTimeout(() => b.textContent = old, 1200);
    });
  });

  peerInput.addEventListener('input', () => {
    peerInput.value = peerInput.value.replace(/\D/g, '').slice(0, 4);
  });

  connectBtn.addEventListener('click', () => {
    const target = peerInput.value.trim();
    if (target.length !== 4) { statusText.textContent = 'Enter the other device\'s 4-digit code'; return; }
    statusText.textContent = 'Linking…';
    const c = peer.connect(target, {reliable:true});
    setupConnection(c);
  });

  function setupConnection(c){
    conn = c;
    remoteId = c.peer;
    conn.on('open', () => {
      reconnectAttempts = 0;
      linkViz.classList.add('connected');
      statusText.innerHTML = 'Live link with ' + conn.peer + '<span class="ping" id="pingVal"></span>';
      statusText.classList.add('live');
      chatCard.style.display = 'flex';
      addSys('Connected to ' + conn.peer);
      clearInterval(pingTimer);
      pingTimer = setInterval(() => {
        if (conn && conn.open) conn.send({type:'ping', t: Date.now()});
      }, 4000);
    });
    conn.on('data', data => handleIncoming(data));
    conn.on('close', () => {
      clearInterval(pingTimer);
      linkViz.classList.remove('connected');
      statusText.classList.remove('live');
      if (!manualClose) {
        statusText.textContent = 'Link dropped — reconnecting…';
        addSys('Connection lost, retrying…');
        attemptReconnect();
      } else {
        statusText.textContent = 'Link closed';
      }
    });
    conn.on('error', () => addSys('Connection error'));
  }

  // ---------- Chat / file transfer (chunked, with progress) ----------
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const fileTrigger = document.getElementById('fileTrigger');
  const fileInput = document.getElementById('fileInput');
  const CHUNK = 16 * 1024;
  const incoming = {}; // id -> {name, mime, size, received, chunks[], el}

  function addMsg(text, cls){
    const el = document.createElement('div');
    el.className = 'msg ' + cls;
    el.innerHTML = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }
  const addSys = t => addMsg(t, 'sys');

  function sendText(){
    const text = msgInput.value.trim();
    if (!text || !conn || !conn.open) return;
    conn.send({type:'text', text});
    addMsg(escapeHtml(text), 'me');
    msgInput.value = '';
  }
  sendBtn.addEventListener('click', sendText);
  msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });

  fileTrigger.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    [...fileInput.files].forEach(queueFile);
    fileInput.value = '';
  });

  // Drag-and-drop onto the session card
  ['dragover','dragenter'].forEach(ev => chatCard.addEventListener(ev, e => {
    e.preventDefault(); chatCard.classList.add('dragover');
  }));
  ['dragleave','drop'].forEach(ev => chatCard.addEventListener(ev, e => {
    e.preventDefault(); chatCard.classList.remove('dragover');
  }));
  chatCard.addEventListener('drop', e => {
    if (!e.dataTransfer.files.length) return;
    [...e.dataTransfer.files].forEach(queueFile);
  });

  function queueFile(file){
    if (!conn || !conn.open) { addSys('Not linked yet'); return; }
    if (file.size > 25 * 1024 * 1024) { addSys(file.name + ' is too large (25MB limit)'); return; }
    const id = Math.random().toString(36).slice(2);
    const bubble = addMsg(
      '<strong>' + escapeHtml(file.name) + '</strong><div class="progwrap"><div class="progbar" id="p-' + id + '"></div></div>',
      'me'
    );
    conn.send({type:'file-start', id, name:file.name, mime:file.type, size:file.size});
    let offset = 0;
    const bar = bubble.querySelector('.progbar');
    (function readNext(){
      if (offset >= file.size) { conn.send({type:'file-end', id}); return; }
      const slice = file.slice(offset, offset + CHUNK);
      const reader = new FileReader();
      reader.onload = () => {
        conn.send({type:'file-chunk', id, data: reader.result});
        offset += slice.size;
        bar.style.width = Math.min(100, Math.round(offset / file.size * 100)) + '%';
        readNext();
      };
      reader.readAsArrayBuffer(slice);
    })();
  }

  function handleIncoming(data){
    if (!data || !data.type) return;
    if (data.type === 'text') {
      addMsg(escapeHtml(data.text), 'them');
    } else if (data.type === 'ping') {
      conn.send({type:'pong', t:data.t});
    } else if (data.type === 'pong') {
      const el = document.getElementById('pingVal');
      if (el) el.textContent = ' · ' + (Date.now() - data.t) + 'ms';
    } else if (data.type === 'file-start') {
      const bubble = addMsg(
        '<strong>' + escapeHtml(data.name) + '</strong><div class="progwrap"><div class="progbar" id="r-' + data.id + '"></div></div>',
        'them'
      );
      incoming[data.id] = {name:data.name, mime:data.mime, size:data.size, received:0, chunks:[], bubble};
    } else if (data.type === 'file-chunk') {
      const f = incoming[data.id];
      if (!f) return;
      f.chunks.push(data.data);
      f.received += data.data.byteLength;
      const bar = document.getElementById('r-' + data.id);
      if (bar) bar.style.width = Math.min(100, Math.round(f.received / f.size * 100)) + '%';
    } else if (data.type === 'file-end') {
      const f = incoming[data.id];
      if (!f) return;
      const blob = new Blob(f.chunks, {type: f.mime || 'application/octet-stream'});
      const url = URL.createObjectURL(blob);
      f.bubble.innerHTML = 'File received: <a href="' + url + '" download="' + escapeHtml(f.name) + '">' + escapeHtml(f.name) + '</a>';
      delete incoming[data.id];
    }
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  } // end initApp
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registration failed:', err));
    });
  }
</script>
</body>
</html>
